name: Schei
options:
  bundleIdPrefix: im.filippo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "1600"

settings:
  base:
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_LDFLAGS: -ObjC

targets:
  Schei:
    type: application
    platform: iOS
    sources:
      - path: Schei
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Schei
        PRODUCT_BUNDLE_IDENTIFIER: im.filippo.soldo
        INFOPLIST_FILE: Schei/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Schei/Support/Schei.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: ScheiWidgetExtension

  ScheiWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ScheiWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: ScheiWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: im.filippo.soldo.widget
        INFOPLIST_FILE: ScheiWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScheiWidget/ScheiWidget.entitlements
        SKIP_INSTALL: YES

schemes:
  Schei:
    build:
      targets:
        Schei: all
    run:
      config: Debug
    archive:
      config: Release
