name: Soldo
options:
  bundleIdPrefix: im.filippo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "1600"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_LDFLAGS: -ObjC

targets:
  Soldo:
    type: application
    platform: iOS
    sources:
      - path: Soldo
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Soldo
        PRODUCT_BUNDLE_IDENTIFIER: im.filippo.soldo
        INFOPLIST_FILE: Soldo/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Soldo/Support/Soldo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: SoldoWidgetExtension

  SoldoWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SoldoWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SoldoWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: im.filippo.soldo.widget
        INFOPLIST_FILE: SoldoWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SoldoWidget/SoldoWidget.entitlements
        SKIP_INSTALL: YES

schemes:
  Soldo:
    build:
      targets:
        Soldo: all
    run:
      config: Debug
    archive:
      config: Release
